      limit 1

  - id: q18
    category: coverage
    question: How many stations reported on every day of the period?
    gold_sql: |
      select count(*) as stations
      from main_marts.mart_station_coverage
      where days_reported = (select max(days_reported) from main_marts.mart_station_coverage)

  - id: q19
    category: dimension
    question: Which network code has the most stations?
    gold_sql: |
      select network_code, count(*) as stations
      from main_marts.dim_station
      where is_current
      group by network_code
      order by stations desc
      limit 1

  - id: q20
    category: aggregate
    question: What was the average wind speed across all stations on 2026-10-06?
    gold_sql: |
      select avg(awnd_ms) as avg_awnd_ms
      from main_marts.fct_station_day
      where obs_date = date '2026-10-06' and awnd_ms is not null

  - id: q21
    category: approval
    question: List the ten hottest station-days in the data.
    expect_approval: true
    gold_sql: |
      select f.station_id, d.station_name, d.state, f.obs_date, f.tmax_c
      from main_marts.fct_station_day f
      join main_marts.dim_station d on d.station_id = f.station_id and d.is_current
      where f.tmax_c is not null
      order by f.tmax_c desc, f.station_id, f.obs_date
