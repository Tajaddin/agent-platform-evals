  - id: q46
    category: aggregate
    question: How many stations reported rain in Florida on 2026-10-09, and how much fell at the wettest one?
    gold_sql: |
      select stations_with_rain, max_prcp_mm
      from main_marts.mart_daily_state_summary
      where state = 'FL' and obs_date = date '2026-10-09'

  - id: q47
    category: timeseries
    question: How many stations reported in Florida on each day?
    gold_sql: |
      select obs_date, reporting_stations
