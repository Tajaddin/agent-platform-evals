  - id: q29
    category: dimension
    question: How many stations have an elevation above 3000 meters?
    gold_sql: |
      select count(*) as stations
      from main_marts.dim_station
      where is_current and elevation_m > 3000

  - id: q30
    category: aggregate
    question: What was the average minimum temperature in Alaska on 2026-10-12?
    gold_sql: |
