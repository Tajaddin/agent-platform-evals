# Golden set for the analyst agent. Every entry with gold_sql is checked by execution accuracy: the agent's
# query result must equal the gold query's result (sets of rows, numbers within tolerance). Entries with
# expect_status only check the agent's behaviour (clarify / refuse / answer without a query).
#
# The warehouse is the frozen 12-day NOAA GHCN-Daily export under data/sample (2026-10-03 to 2026-10-14).
# The fake provider answers these questions with the gold SQL verbatim, so with AGENT_PROVIDER=fake the
# numbers below measure the pipeline (guard, execution, memory, API), not a model.

questions:
  # ---------------------------------------------------------------- single-table aggregates
  - id: q01
    category: aggregate
    question: How many weather stations reported on 2026-10-10?
    gold_sql: |
      select count(distinct station_id) as stations
      from main_marts.fct_station_day
      where obs_date = date '2026-10-10'

  - id: q02
    category: aggregate
    question: What was the highest maximum temperature recorded in Florida on 2026-10-10?
    gold_sql: |
      select max(tmax_c) as max_tmax_c
      from main_marts.mart_florida_weather
      where obs_date = date '2026-10-10'

  - id: q03
    category: ranking
    question: Which state had the highest average maximum temperature on 2026-10-12?
    gold_sql: |
      select state, avg_tmax_c
      from main_marts.mart_daily_state_summary
      where obs_date = date '2026-10-12' and avg_tmax_c is not null
      order by avg_tmax_c desc
      limit 1

  - id: q04
    category: ranking
    question: Which five states had the most rain at a single station on 2026-10-08?
    gold_sql: |
      select state, max_prcp_mm
      from main_marts.mart_daily_state_summary
      where obs_date = date '2026-10-08' and max_prcp_mm is not null
      order by max_prcp_mm desc
      limit 5

  - id: q05
    category: dimension
    question: How many stations are in Florida?
    aliases:
      - How many weather stations are there in Florida?
    gold_sql: |
      select count(*) as stations
      from main_marts.dim_station
      where is_current and state = 'FL'

  - id: q06
    category: dimension
    question: How many current stations are there per state? Show the top 10.
    gold_sql: |
      select state, count(*) as stations
      from main_marts.dim_station
      where is_current
      group by state
      order by stations desc, state
      limit 10

  - id: q07
    category: aggregate
    question: What was the average daily precipitation across Texas stations on 2026-10-05?
    gold_sql: |
      select avg_prcp_mm
      from main_marts.mart_daily_state_summary
      where state = 'TX' and obs_date = date '2026-10-05'

  - id: q08
    category: aggregate
    question: What was the coldest minimum temperature anywhere on 2026-10-14?
    gold_sql: |
      select min(tmin_c) as min_tmin_c
      from main_marts.fct_station_day
      where obs_date = date '2026-10-14'

  - id: q09
    category: join
    question: Which station recorded the coldest temperature on 2026-10-14?
    gold_sql: |
      select f.station_id, d.station_name, d.state, f.tmin_c
      from main_marts.fct_station_day f
      join main_marts.dim_station d on d.station_id = f.station_id and d.is_current
      where f.obs_date = date '2026-10-14' and f.tmin_c is not null
      order by f.tmin_c asc, f.station_id
      limit 1

  - id: q10
    category: metadata
    question: What is the date range covered by the data?
    aliases:
      - How many days of data are in the warehouse?
      - Which dates does the data cover?
    gold_sql: |
      select min(obs_date) as first_day, max(obs_date) as last_day, count(distinct obs_date) as days
      from main_marts.mart_daily_state_summary

  - id: q11
    category: approval
    question: How many station-day rows are there in total?
    expect_approval: true
    gold_sql: |
      select count(*) as station_days
      from main_marts.fct_station_day

  - id: q12
    category: timeseries
    question: Show the daily average maximum temperature in Florida for each day.
    gold_sql: |
      select obs_date, avg_tmax_c
      from main_marts.mart_daily_state_summary
      where state = 'FL'
      order by obs_date

  - id: q13
    category: ranking
    question: Which Florida station had the most rain on 2026-10-09?
    gold_sql: |
      select station_name, prcp_mm
      from main_marts.mart_florida_weather
      where obs_date = date '2026-10-09' and prcp_mm is not null
      order by prcp_mm desc, station_id
      limit 1

  - id: q14
    category: lookup
    question: What was the maximum temperature in Fahrenheit at Tampa International Airport on 2026-10-10?
    gold_sql: |
      select station_name, tmax_f
      from main_marts.mart_florida_weather
      where station_name = 'TAMPA INTL AP' and obs_date = date '2026-10-10'

  - id: q15
    category: aggregate
    question: How many stations in Florida reported rain on 2026-10-11?
    gold_sql: |
      select stations_with_rain
      from main_marts.mart_daily_state_summary
      where state = 'FL' and obs_date = date '2026-10-11'

  - id: q16
    category: join
    question: Which states had snow on 2026-10-13?
    gold_sql: |
      select distinct d.state
      from main_marts.fct_station_day f
      join main_marts.dim_station d on d.station_id = f.station_id and d.is_current
      where f.obs_date = date '2026-10-13' and f.snow_mm > 0
      order by d.state

  - id: q17
    category: ranking
    question: What was the largest diurnal temperature range on 2026-10-07?
    gold_sql: |
      select station_id, diurnal_range_c
      from main_marts.fct_station_day
      where obs_date = date '2026-10-07' and diurnal_range_c is not null
