# One grouped pull request per ecosystem per month: enough to stay current without a queue of
# single-package PRs, each running the full CI.
version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: monthly
  groups:
    uv:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    github_actions:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  groups:
    docker:
      patterns:
      - '*'
- package-ecosystem: terraform
  directory: /infra/aws
  schedule:
    interval: monthly
  groups:
    terraform:
      patterns:
      - '*'
